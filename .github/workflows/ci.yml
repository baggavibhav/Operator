name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run core tests
        run: >-
          python -c "import subprocess,sys; p=subprocess.run([sys.executable,'-m','unittest','discover','-s','tests','-v'],capture_output=True,text=True); out=p.stdout+p.stderr; open('test-output.txt','w',encoding='utf-8').write(out); print(out); sys.exit(p.returncode)"
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-output.txt
      - name: Compile sources
        run: python -m compileall -q local_operator operator_desktop local_operator_cli.py desktop_main.py
